<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e7,#ffeef5);
overflow:hidden;
}

.container{
text-align:center;
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 10px 35px rgba(0,0,0,.15);
width:90%;
max-width:420px;
z-index:2;
}

h1{
font-size:34px;
color:#ff4d88;
margin-bottom:15px;
}

p{
font-size:18px;
color:#555;
line-height:1.7;
margin-bottom:30px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:50px;
background:#ff4d88;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
background:#ff2f73;
}

.note{
position:absolute;
font-size:20px;
animation:float 12s linear infinite;
opacity:.6;
}

@keyframes float{

0%{
transform:translateY(100vh);
}

100%{
transform:translateY(-120vh);
}

}



#page1{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

justify-content:center;
align-items:center;

background:linear-gradient(135deg,#5b0b16,#2b0008);

overflow:auto;

padding:30px;

}

.page1Card{

width:100%;
display:flex;
justify-content:center;

}

.paper{

width:92%;
max-width:390px;

background:#fff8ef;

padding:25px;

border-radius:18px;

box-shadow:0 15px 35px rgba(0,0,0,.35);

position:relative;

animation:fade .8s;

}

.bow{

position:absolute;

top:-20px;

left:50%;

transform:translateX(-50%);

font-size:40px;

}

.polaroid{

width:240px;

margin:auto;

background:white;

padding:10px;

border-radius:5px;

transform:rotate(-3deg);

box-shadow:0 8px 20px rgba(0,0,0,.2);

margin-bottom:25px;

}

.polaroid img{

width:100%;
display:block;

}

.polaroid p{

margin-top:10px;

font-size:13px;

text-align:center;

color:#555;

}

.paper h1{

text-align:center;

color:#8b0000;

margin-bottom:18px;

}

.paper .letter{

font-size:16px;

line-height:1.9;

text-align:center;

color:#5d4037;

}
.paper{

width:90%;
max-width:390px;

background:#f9f2e7;

border-radius:18px;

padding:25px;

box-shadow:0 20px 40px rgba(0,0,0,.35);

position:relative;

animation:fade .8s;

}

.bow{

font-size:42px;

position:absolute;

top:-20px;

left:50%;

transform:translateX(-50%);

}

.polaroid{

background:white;

padding:10px;

border-radius:6px;

box-shadow:0 8px 20px rgba(0,0,0,.2);

transform:rotate(-3deg);

margin:auto;

margin-bottom:25px;

width:240px;

}

.polaroid img{

width:100%;

border-radius:4px;

}

.polaroid p{

margin-top:8px;

font-size:13px;

color:#444;

text-align:center;

}

.paper h1{

color:#8b0000;

font-size:30px;

text-align:center;

margin-bottom:15px;

}

.paper .letter{

color:#5b3a29;

font-size:16px;

line-height:1.9;

text-align:center;

}

.page1Card h1{

color:#ff6b81;

margin-bottom:20px;

}

.letter{

line-height:1.8;

font-size:15px;

}

#storyBtn{

margin-top:25px;

background:#b1002d;

padding:14px 35px;

border:none;

border-radius:40px;

color:white;

font-size:16px;

cursor:pointer;

}

#secretHeart{

position:fixed;

bottom:20px;

right:20px;

font-size:30px;

cursor:pointer;

animation:heartbeat 1.6s infinite;

}
@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}
@keyframes heartbeat{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.2);

}

}
</style>
</head>

<body>

<div class="note" style="left:10%;">💌</div>
<div class="note" style="left:25%;animation-delay:2s;">🌸</div>
<div class="note" style="left:40%;animation-delay:5s;">❤️</div>
<div class="note" style="left:60%;animation-delay:1s;">✨</div>
<div class="note" style="left:75%;animation-delay:6s;">🌷</div>
<div class="note" style="left:90%;animation-delay:3s;">💕</div>

<div class="container">

<h1>Hi Love ❤️</h1>

<p>
I made a tiny little surprise for you...<br><br>

Nothing too fancy,<br>
just something made with lots of love,
a little effort,
and many smiles. ❤️
</p>

<button onclick="nextPage()">
Open My Surprise ✨
</button>

</div>
<script>

function nextPage(){

alert("Button clicked!");

document.querySelector(".container").style.display="none";

document.querySelectorAll(".note").forEach(note=>{
note.style.display="none";
});

document.getElementById("page1").style.display="flex";

}

window.onload=function(){

document.getElementById("secretHeart").onclick=function(){

alert("You already make every day special just by existing. ❤️");

}

document.getElementById("storyBtn").onclick=function(){

alert("Page 2 - Our Story ❤️");

}

}

</script>
<div id="page1">



<div id="secretHeart">❤️</div>

</div>
</body>
</html>
